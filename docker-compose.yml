# ─────────────────────────────────────────────────────────────────────────────
# DocMind — full local stack
#   app        : FastAPI application
#   postgres   : persistent chat history & session metadata
#   qdrant     : vector store
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Application ─────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: docmind-app:latest
    container_name: docmind_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env.docker        # secrets / API keys (never commit the real values)
    environment:
      # Override the env file for service discovery inside the compose network
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      QDRANT_URL: "http://qdrant:6333"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      # Persist uploaded files across restarts
      - uploads_data:/app/data/uploads
      # Persist logs
      - app_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: docmind_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docmind123}
      POSTGRES_DB: ${POSTGRES_DB:-docmind}
    ports:
      - "5432:5432"          # expose locally for debugging; remove in production
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docmind} -d ${POSTGRES_DB:-docmind}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Qdrant ──────────────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.18.0
    container_name: docmind_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"          # REST API (expose locally for debugging)
      - "6334:6334"          # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6333' || curl -f http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

# ─────────────────────────────────────────────────────────────────────────────
# Named volumes – data persists across `docker compose down` restarts
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  qdrant_data:
  uploads_data:
  app_logs:
