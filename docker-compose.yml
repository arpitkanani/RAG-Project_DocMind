# ─────────────────────────────────────────────────────────────────────────────
# DocMind — full local stack
#   app        : FastAPI application
#   postgres   : persistent chat history & session metadata
#   qdrant     : vector store
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Application ─────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: docmind-app:latest
    container_name: docmind_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env.docker        # secrets / API keys (never commit the real values)
    environment:
      # Rely entirely on .env / Supabase for DB connections
      QDRANT_URL: "http://qdrant:6333"
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      # Live bind-mount so code updates apply immediately without rebuilding
      - .:/app
      # Persist uploaded files across restarts
      - uploads_data:/app/data/uploads
      # Persist logs
      - app_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── Qdrant ──────────────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.18.0
    container_name: docmind_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"          # REST API (expose locally for debugging)
      - "6334:6334"          # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6333' || curl -f http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

# ─────────────────────────────────────────────────────────────────────────────
# Named volumes – data persists across `docker compose down` restarts
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  qdrant_data:
  uploads_data:
  app_logs:
