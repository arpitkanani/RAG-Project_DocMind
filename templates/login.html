<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In – DocuVortex</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/main.css" />
  <link rel="stylesheet" href="/static/css/auth.css" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: radial-gradient(circle at top left, rgba(106, 72, 235, 0.12), transparent 32%),
                  radial-gradient(circle at bottom right, rgba(0, 196, 140, 0.08), transparent 34%),
                  linear-gradient(180deg, #f8f9fb 0%, #eef0ff 100%);
      padding: 16px;
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow-x: hidden;
    }
    .auth-modal-card {
      transform: none !important;
      opacity: 1 !important;
      visibility: visible !important;
    }
  </style>
</head>
<body>

  <div class="auth-modal-card">
    <a href="/" class="auth-close-btn" title="Back to home">&times;</a>

    <div class="auth-header">
      <div class="auth-brand-badge">DV</div>
      <h1 class="auth-title">Welcome to DocuVortex</h1>
      <p class="auth-subtitle">Sign in or register to access your workspace</p>
    </div>

    <div class="auth-error-msg" id="authError"></div>

    <form class="auth-step" id="loginAuthForm" onsubmit="return false;">
      <div class="auth-input-group">
        <label for="authUsername">Username</label>
        <input type="text" id="authUsername" class="auth-input" placeholder="e.g. alex" required autocomplete="username" />
      </div>

      <div class="auth-input-group">
        <label for="authEmail">Email Address</label>
        <input type="email" id="authEmail" class="auth-input" placeholder="name@company.com" required autocomplete="email" />
      </div>

      <div class="auth-input-group">
        <label for="authPassword">Password</label>
        <div class="password-input-wrapper">
          <input type="password" id="authPassword" class="auth-input" placeholder="Enter password" required autocomplete="current-password" />
          <button type="button" class="password-toggle-btn" id="btnTogglePassword" title="Show or hide password" aria-label="Toggle password visibility">
            <svg class="eye-icon eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg class="eye-icon eye-closed" style="display:none;" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
        <div class="auth-aux-row">
          <a href="javascript:void(0)" class="auth-forgot-link" id="btnForgotPwd">Forgot password?</a>
        </div>
      </div>

      <!-- Math Captcha Horizontal Row -->
      <div class="auth-input-group">
        <label for="captchaAnswer">Verification Captcha</label>
        <div class="captcha-row">
          <div class="captcha-badge" title="Solve this math problem">
            <span class="captcha-math-text" id="captchaQuestion">4 + 7</span>
            <span class="captcha-equal">=</span>
          </div>
          <input
            type="text"
            inputmode="numeric"
            pattern="[0-9]*"
            id="captchaAnswer"
            class="captcha-input-compact"
            placeholder=""
            required
            autocomplete="off"
          />
          <button
            type="button"
            class="captcha-refresh-btn"
            id="btnRefreshCaptcha"
            title="Generate new challenge"
          >&#8635;</button>
        </div>
        <input type="hidden" id="captchaToken" value="11:fallback" />
      </div>

      <button type="button" class="auth-btn-primary" id="btnSubmitAuth">Sign In to Workspace &rarr;</button>
    </form>
  </div>

  <!-- Forgot Password Popup Modal -->
  <div class="forgot-modal-backdrop" id="forgotModalBackdrop">
    <div class="forgot-modal-card">
      <button type="button" class="forgot-close-btn" id="btnCloseForgot" title="Close">&times;</button>
      <div class="forgot-header">
        <h2 class="forgot-title">Recover Password</h2>
        <p class="forgot-subtitle">Enter your registered email to retrieve your password directly.</p>
      </div>
      <div class="auth-error-msg" id="forgotError" style="display:none;"></div>
      
      <div class="forgot-body" id="forgotFormBody">
        <div class="auth-input-group">
          <label for="forgotEmail">Registered Email</label>
          <input type="email" id="forgotEmail" class="auth-input" placeholder="name@company.com" required />
        </div>
        <button type="button" class="auth-btn-primary" id="btnSubmitForgot">Show My Password &rarr;</button>
      </div>

      <div class="forgot-result" id="forgotResultBox" style="display:none;">
        <div class="forgot-result-card">
          <span class="forgot-result-label">Your account password is:</span>
          <div class="forgot-result-pwd-row">
            <span class="forgot-result-pwd" id="recoveredPasswordText">******</span>
            <button type="button" class="forgot-copy-btn" id="btnCopyRecoveredPwd" title="Copy to clipboard">Copy</button>
          </div>
        </div>
        <button type="button" class="auth-btn-primary" id="btnUseRecoveredPwd" style="margin-top: 14px;">Fill in Login & Continue &rarr;</button>
      </div>
    </div>
  </div>

  <script src="/static/js/auth.js?v=2"></script>
</body>
</html>
