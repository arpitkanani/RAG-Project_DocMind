embedding:
  model: "nomic-embed-text"

llm:
  provider: "groq"
  model: "llama-3.3-70b-versatile"
  temperature: 0.5


# splitting chunks of text for embedding and retrieval
splitter:
  strategy: "recursive"
  chunk_size: 700
  chunk_overlap: 200
  separators:
    - "\n\n"
    - "\n"
    - " "
    - ""
  breakpoint_threshold_type: "percentile"
  breakpoint_threshold_amount: 80  

# retriver use MMR for divers answer
retriever:
  search_type: "similarity"
  k: 4
  fetch_k: 10
  lambda_mult: 0.7
  score_threshold: 0.45
  summary_max_chars: 6000 

#vectore database used chroma
vectorstore:
  url: "http://localhost:6333"
  collection_name: "docmind"              # name of collection

memory:
  persist_directory: "data/memory"          # saved here on disk
  window_days: 7                          # how many past interactions to remember

upload:
  allowed_extensions:
    - ".pdf"
    - ".txt"
    - ".docx"
    - ".csv"
    - ".md"
    - ".xlsx"
  upload_dir: "data/uploads"
  max_file_size_mb: 20      
  max_files_count: 5  

youtube:
  language: ["en","hi","gu"]   # language for YouTube video transcription
  max_chars: 150000

