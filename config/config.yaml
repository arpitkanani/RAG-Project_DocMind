embedding:
  model: "BAAI/bge-small-en-v1.5"
  device: "cpu"

llm:
  provider: "groq"
  model: "openai/gpt-oss-20b"
  temperature: 0.1
  max_tokens: 1024
  rate_limit:
    patterns:
      rpd: ["requests per day", "request per day", "rpd", "daily limit", "requests_per_day"]
      tpd: ["tokens per day", "tpd", "daily token"]
      tpm: ["tokens per minute", "tpm", "tokens_per_minute"]
      rpm: []   # fallback — used when nothing more specific matches
    messages:
      rpm: "We're getting a lot of questions right now — please wait about a minute and try again."
      tpm: "That answer needs a bit more room to breathe — please wait a few seconds and try again."
      rpd: "We've hit today's question limit. Please try again after midnight, or contact support if this keeps happening."
      tpd: "We've hit today's usage limit for answers. Please try again tomorrow."
      default: "We're experiencing high demand right now. Please wait a moment and try again."

# splitting chunks of text for embedding and retrieval
splitter:
  strategy: "recursive"
  chunk_size: 900
  chunk_overlap: 250
  separators:
    - "\n\n"
    - "\n"
    - " "
    - ""
  breakpoint_threshold_type: "percentile"
  breakpoint_threshold_amount: 80  

# retriver use MMR for divers answer
retriever:
  search_type: "similarity"
  k: 7
  fetch_k: 45
  max_query_variants: 3
  lambda_mult: 0.6
  score_threshold: 0.3
  summary_max_chars: 6000 
  collection_margin: 0.8
  doc_margin: 0.7

# vector database
vectorstore:
  url: "http://localhost:6333"
  collection_name: "docmind"

memory:
  persist_directory: "data/memory"
  window_days: 7
  recent_messages_verbatim: 6

upload:
  allowed_extensions:
    - ".pdf"
    - ".txt"
    - ".docx"
    - ".csv"
    - ".md"
    - ".xlsx"
  upload_dir: "data/uploads"
  max_file_size_mb: 100
  max_files_count: 5

youtube:
  language: ["en","hi","gu"]
  max_chars: 150000

postgres:
  host: localhost
  port: 5432
  user: docmind
  password: docmind@1411
  database: docmind
